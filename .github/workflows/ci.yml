# SUP Platform CI — minőségkapuk (FEJLESZTESI_DOKUMENTACIO 10. fejezet)
# KAPU-SZABÁLY: piros CI-val nincs merge — a subagentek sem kerülhetik meg.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Típus-kapu (tsc strict)
        run: npm run typecheck
      - name: Lint-kapu (ESLint + modul-határok)
        run: npm run lint
      - name: Unit-kapu (Vitest)
        run: npm test

  # F1.2-től: RLS policy-tesztek (pgTAP, anon/user(confirmed/unconfirmed)/moderator/admin
  # szerepben). Tiszta lokális Supabase-en futnak: migrációk + seed → pgTAP tesztek.
  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1
      - name: Lokális Postgres (migrációk + seed)
        run: supabase db start
      - name: RLS policy-tesztek (pgTAP)
        run: supabase test db --local

  # F1.10: Playwright e2e + axe a11y kapu.
  #
  # LOKÁLIS Supabase-stack ellen fut (ugyanaz, amit az rls-tests használ): így a
  # seed DETERMINISZTIKUS, és a tesztek NEM írnak az éles projektbe. A publishable
  # kulcsot a `supabase status` adja — nincs szükség repository secretre.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.100.1

      - run: npm ci
      - name: Playwright böngésző (chromium)
        run: npx playwright install --with-deps chromium

      - name: Lokális Supabase (migrációk + seed)
        run: supabase db start

      - name: Env a lokális stackhez
        run: |
          echo "VITE_SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: E2E + a11y kapu (Playwright + axe)
        run: npm run e2e

      - name: Riport feltöltése (bukásnál is)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
