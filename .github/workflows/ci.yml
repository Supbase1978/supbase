# SUP Platform CI — minőségkapuk (FEJLESZTESI_DOKUMENTACIO 10. fejezet)
# KAPU-SZABÁLY: piros CI-val nincs merge — a subagentek sem kerülhetik meg.
#
# A `uses:` hivatkozások TELJES COMMIT-SHA-ra pinnelve (a komment mutatja a
# verziót): a mozgó tag/branch némán átirányítható, és pont így történt a
# trivy-action és a kics-github-action kompromittálása. Frissítéskor a SHA-t is
# cserélni kell — érdemes Dependabotra bízni (F2).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Típus-kapu (tsc strict)
        run: npm run typecheck
      - name: Lint-kapu (ESLint + modul-határok)
        run: npm run lint
      - name: Unit-kapu (Vitest)
        run: npm test

  # F1.2-től: RLS policy-tesztek (pgTAP, anon/user(confirmed/unconfirmed)/moderator/admin
  # szerepben). Tiszta lokális Supabase-en futnak: migrációk + seed → pgTAP tesztek.
  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.100.1
      - name: Lokális Postgres (migrációk + seed)
        run: supabase db start
      - name: RLS policy-tesztek (pgTAP)
        run: supabase test db --local

      # BUKÁSKOR A POSTGRES NAPLÓJA IS KELL, nem csak a pgTAP-kimenet.
      #
      # A `42_push_webpush_test.sql` futásakor a szerver ÖSSZEOMLIK: a psql
      # „server closed the connection unexpectedly"-t ír, utána a hátralévő
      # tesztfájlok már „the database system is in recovery mode"-dal sem
      # tudnak csatlakozni — egyetlen crash nyolc további fájlt visz magával.
      # Azt viszont, hogy MI vitte el a backendet (PANIC, segfault, OOM-kill),
      # kizárólag a szerver saját naplója mondja meg; a kliensoldali kimenetből
      # nem következtethető ki. Ezért fut ez a lépés bukás esetén.
      - name: Postgres-napló bukáskor
        if: failure()
        run: |
          cid="$(docker ps -aq --filter 'name=supabase_db_' | head -1)"
          if [ -n "$cid" ]; then
            docker logs --tail 400 "$cid" 2>&1
          else
            echo "Nincs supabase_db_ konténer — a stack el sem indult."
          fi

  # F1.10: Playwright e2e + axe a11y kapu.
  #
  # LOKÁLIS Supabase-stack ellen fut (ugyanaz, amit az rls-tests használ): így a
  # seed DETERMINISZTIKUS, és a tesztek NEM írnak az éles projektbe. A publishable
  # kulcsot a `supabase status` adja — nincs szükség repository secretre.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.100.1

      - run: npm ci
      - name: Playwright böngésző (chromium)
        run: npx playwright install --with-deps chromium

      # TELJES STACK, nem `db start` (2026-08-23).
      #
      # A `supabase db start` KIZÁRÓLAG a Postgrest indítja el — API-átjárót
      # (Kong), Auth-ot, REST-et nem. A `supabase status` ilyenkor „Stopped
      # services"-t ír, az `API_URL=` sor pedig meg sem jelenik, tehát a
      # `VITE_SUPABASE_URL` ÜRESEN maradt, és a webszerver indulásakor elszállt
      # („Hiányzó környezeti változó"). Ez pirosította az `e2e` jobot
      # 2026-07-31 óta.
      #
      # Az `rls-tests` jobnak elég a `db start` (a pgTAP közvetlenül a
      # Postgreshez csatlakozik) — az e2e-nek viszont a futó alkalmazás kell,
      # tehát a teljes stack.
      - name: Lokális Supabase-stack (migrációk + seed)
        run: supabase start

      - name: Env a lokális stackhez
        run: |
          set -euo pipefail
          # A `-o env` kulcs=érték párokat ad; forrásoljuk, majd a KÉT
          # szükséges változót adjuk tovább. Az üres érték itt MEGÁLLÍTJA a
          # futást — korábban csendben ment tovább, és a hiba csak a
          # webszerver indulásakor derült ki.
          eval "$(supabase status -o env)"
          test -n "${API_URL:-}" || { echo "API_URL üres — fut a stack?" >&2; exit 1; }
          test -n "${ANON_KEY:-}" || { echo "ANON_KEY üres" >&2; exit 1; }
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: E2E + a11y kapu (Playwright + axe)
        run: npm run e2e

      - name: Riport feltöltése (bukásnál is)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # F1.10: Semgrep SAST — minden PR-en (10. fejezet „Biztonság" kapu).
  #
  # Publikus szabálycsomagok, token/fiók NÉLKÜL. A `--error` miatt bármelyik
  # találat PIROS CI-t ad. Egyedi kivételt CSAK a kódban, `nosemgrep`
  # kommenttel + INDOKLÁSSAL szabad tenni (lásd src/core/seo/json-ld.tsx).
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.142.0
      - name: SAST-kapu (Semgrep)
        run: |
          semgrep scan --error --metrics=off \
            --config=p/typescript --config=p/react \
            --config=p/secrets --config=p/owasp-top-ten \
            --config=p/sql-injection \
            --exclude=node_modules --exclude=build --exclude=.react-router

  # Snyk (függőség-audit) HETI + release előtt — külön workflow, mert SNYK_TOKEN
  # repository secretet igényel. Amíg nincs beállítva, az `npm audit` a
  # helyettesítő (a gates jobban futtatható). Lásd docs/AUDIT_CHECKLIST.md.
