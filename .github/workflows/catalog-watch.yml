# catalog-watch — havi piacfigyelő futás (docs/CATALOG_WATCH_TERV.md).
#
# Mit csinál: bejárja az aktív forrásokat, ismert deszkára ársort/„láttuk"
# jelzést ír, ismeretlenre JELÖLTET készít a moderációs sorba
# (/admin/katalogus). Publikálni NEM tud: `boards` sort nem hoz létre.
#
# A `uses:` hivatkozások TELJES COMMIT-SHA-ra pinnelve — indoklás a ci.yml
# fejlécében (mozgó tag = ellátási lánc kockázat).
name: catalog-watch

on:
  schedule:
    # Minden hónap 5. napja, hajnal (UTC) — a boltok forgalmán kívül,
    # udvarias crawl. Havi ritmus szándékosan: a gyártók szezonálisan
    # adnak ki új modellt, a locked_fields/data_verified_at (F2.1-utó-10)
    # pedig már véd a köztes felülírástól, tehát a gyakoriságot nem a
    # kockázat, hanem a kényelmesen ütemezhető moderációs munka szabja.
    - cron: "17 3 5 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Próbafutás írás nélkül"
        type: boolean
        default: false
      max_products:
        description: "Forrásonkénti termék-korlát (üres = a forrás beállítása)"
        type: string
        default: ""

# A futás service-role kulccsal ír: több párhuzamos futás ugyanabba a
# jelölt-sorba dolgozna, ezért egyszerre csak egy mehet.
concurrency:
  group: catalog-watch
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Egy elakadt bolt ne égesse a perckeretet (a CLI-ben kérésenként 20 s).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A böngésző-renderelt fallback (render.ts, F2.1-utó-3) csak akkor
      # indul el, ha egy termék MINDHÁROM méret-mezője hiányzik a sima
      # HTML-ből — a Chromium-telepítés így is kell előre, hogy legyen mit
      # elindítani, ha a crawl közben szükség lesz rá.
      - run: npx playwright install --with-deps chromium

      - name: Crawl
        env:
          # Repo-secretek. A runnerben nincs .env, ezért itt a környezeti
          # változók élnek (tools/catalog-watch/env.ts feloldási sorrendje).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A WORKFLOW-BEMENETEK IS KÖRNYEZETI VÁLTOZÓBAN (Semgrep
          # `run-shell-injection`, 2026-08-23). Korábban `${{ inputs.* }}`
          # interpolációval kerültek a `run:` blokkba — a `max_products`
          # SZABAD SZÖVEGES bemenet, tehát aki el tudta indítani a
          # workflow-t, tetszőleges parancsot futtathatott a runneren, és
          # onnan a SERVICE-ROLE KULCSHOZ fért volna.
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_PRODUCTS: ${{ inputs.max_products }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$MAX_PRODUCTS" ]; then
            # SZÁMKÉNT ellenőrizve: a szabad szöveges bemenetből így semmi más
            # nem kerülhet a parancssorba. Hibás értéknél inkább megállunk,
            # mint hogy csendben az egész katalógust végigjárjuk.
            case "$MAX_PRODUCTS" in
              *[!0-9]*) echo "A --max csak szám lehet, ez érkezett: $MAX_PRODUCTS" >&2; exit 1 ;;
              *) args+=(--max "$MAX_PRODUCTS") ;;
            esac
          fi
          node tools/catalog-watch/cli.ts crawl "${args[@]}"

      - name: Kifutás-jelöltek jelentése
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Csak JELENTÉS: a státuszt a moderátor erősíti meg az admin felületen.
        run: node tools/catalog-watch/cli.ts lifecycle
